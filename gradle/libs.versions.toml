[versions]
# Build toolchain — deliberately identical to the sibling backup-engine, which already builds and
# publishes through JitPack with exactly this combination. AGP 9.x exists but would force Gradle
# >= 9.1 and put an unproven toolchain in front of the release path for zero benefit here.
kotlin = "2.3.20"
agp = "8.13.0"

# :stt runtime — the ONLY runtime dependency. Zero-deps-beyond-coroutines is a feature for a
# reusable library, exactly as web/'s zero runtime deps is.
coroutines = "1.11.0"

# D-12 / Obstacle 2: binary-compatibility-validator gives :stt apiDump/apiCheck, which freezes the
# public surface. It is in maintenance mode upstream (fixes + new Kotlin versions only) — acceptable,
# since the tool's whole job is a byte-diff of a text file.
bcv = "0.18.1"

# :stt tests. Robolectric is pinned to 4.16.1 (sibling pins 4.14.1) because the platform-adapter
# suite needs 4.16.1's ShadowSpeechRecognizer API. androidx-test-* carry the on-device D-04 probe.
junit = "4.13.2"
robolectric = "4.16.1"
androidx-test-core = "1.6.1"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"

# :demo module only (plan 07) — never published (D-23). compose-bom is 2026.06.00 and NOT
# 2026.07.00: the registry probe returned 404 for .07, so .06 is the latest that exists.
compose-bom = "2026.06.00"
activity-compose = "1.11.0"
lifecycle-runtime-compose = "2.9.4"

[libraries]
# :stt — coroutines. The `-android` artifact (not `-core`) is required: D-09's main-thread contract
# needs Dispatchers.Main.immediate, which only ships in kotlinx-coroutines-android.
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# JVM suite — runTest drives the restart ladder and dedup suites deterministically.
coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit              = { module = "junit:junit", version.ref = "junit" }
# JVM-host Android runtime, for the thin platform adapter only — the engine core is tested behind
# the RecognizerHandle seam with plain JUnit and no Robolectric.
robolectric        = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

# Instrumented tests — the D-04 capability probe runs on the tester device through these.
androidx-test-junit  = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

# :demo only (plan 07). D-07's per-event StateFlow surface exists so a recomposing Compose host can
# read the value now; lifecycle-runtime-compose is what supplies collectAsStateWithLifecycle().
compose-bom               = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
activity-compose          = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-runtime-compose" }

[plugins]
android-library                = { id = "com.android.library", version.ref = "agp" }
android-application            = { id = "com.android.application", version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
